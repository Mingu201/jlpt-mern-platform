version: '3.8'

services:
  # 1. MongoDB Database Container
  mongo:
    image: mongo:7.0
    container_name: jlpt-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - jlpt-network

  # 2. Node.js + Express.js Backend API Container
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jlpt-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/jlpt_platform
      - JWT_SECRET=super_secret_jwt_key_jlpt_docker_production_2026
      - CLIENT_URL=http://localhost
    depends_on:
      - mongo
    networks:
      - jlpt-network

  # 3. React Frontend + Nginx Web Server Container
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: jlpt-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - jlpt-network

volumes:
  mongo_data:
    driver: local

networks:
  jlpt-network:
    driver: bridge
